<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKS Static Web App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>AKS Static Web App</h1>

        <p class="subtitle">
            Containerized with Docker, stored in Azure Container Registry,
            and deployed to Azure Kubernetes Service.
        </p>

        <div class="card">
            <button id="statusButton">Check Application</button>
            <p id="status"></p>
        </div>

        <footer>
            <span id="hostname">Loading host info…</span>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
